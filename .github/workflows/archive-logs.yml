name: Archive CI text logs

on:
  workflow_run:
    workflows: [CI, Fetch & translate problems, Fetch cf-gyms data]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed workflow run ID to archive
        type: string
        required: true

permissions:
  actions: read
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Do not check out or execute code from the originating workflow/PR.
      - name: Download masked job output
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          api="repos/$GITHUB_REPOSITORY/actions"
          attempt=${ATTEMPT:-$(gh api "$api/runs/$RUN_ID" --jq .run_attempt)}
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/logs"
          gh api --paginate "$api/runs/$RUN_ID/attempts/$attempt/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != "skipped" and .started_at != null) | .id' > "$RUNNER_TEMP/job-ids"
          failed=0
          while read -r id; do
            [[ "$id" =~ ^[1-9][0-9]*$ ]]
            # A finished job's log may take a moment to become downloadable.
            for delay in 0 3 10; do
              sleep "$delay"
              if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/$api/jobs/$id/logs" \
                -o "$RUNNER_TEMP/download" && [[ -s "$RUNNER_TEMP/download" ]]; then
                mv "$RUNNER_TEMP/download" "$RUNNER_TEMP/logs/$id.log"
                break
              fi
            done
            if [[ ! -f "$RUNNER_TEMP/logs/$id.log" ]]; then
              echo "::warning::No downloadable log for job $id"
              failed=1
            fi
          done < "$RUNNER_TEMP/job-ids"
          echo "missing=$failed" >> "$GITHUB_OUTPUT"
        id: collect

      - name: Publish text files to ci-logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/logs/*.log)
          if (( ${#files[@]} == 0 )); then exit 0; fi
          gh auth setup-git
          git init -q -b ci-logs archive
          cd archive
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Concurrent runs may finish together. Reapply our files on the latest tip; never force push.
          for retry in 1 2 3 4 5; do
            if [[ -n "$(git ls-remote --heads origin refs/heads/ci-logs)" ]]; then
              git fetch -q --depth=1 origin refs/heads/ci-logs
              git checkout -q -B ci-logs FETCH_HEAD
            fi
            mkdir -p jobs
            cp "${files[@]}" jobs/
            git add -- jobs/
            if git diff --cached --quiet; then exit 0; fi
            git commit -qm 'Archive CI job output [skip ci] [vercel skip]'
            if git push origin HEAD:refs/heads/ci-logs; then exit 0; fi
            sleep "$retry"
          done
          exit 1

      - name: Report incomplete archive
        if: steps.collect.outputs.missing == '1'
        run: exit 1
