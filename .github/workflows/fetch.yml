name: Fetch & translate problems

on:
  schedule:
    # 每小时（错峰 23 分，规避 GitHub 定时任务高峰丢弃）。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      abc_scan:
        description: "扫描最近 N 场 ABC（补新题面）"
        default: "3"
      cf_scan:
        description: "扫描最近 N 场 CF（补新题面）"
        default: "3"
      backfill:
        description: "回填历史未拉取的题面数（从最旧比赛开始）"
        default: "10"
      nc_scan:
        description: "扫描最近 N 场牛客官方赛（补新题面）"
        default: "2"
      translate_limit:
        description: "本次最多翻译题数（0=不限；默认 120 与 npm run fetch:ci 对齐 ——
          不限会让积压期撞 job 时间上限,已产出的 LLM 费用随 commit 步骤未到达而全部丢失）"
        default: "120"
      gym_translate_limit:
        description: "cf-gyms 尾阶段（三平台全部完成之后）最多翻译 gym 题数"
        default: "40"

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 三平台抓取+翻译(120)+gym 尾阶段(10min 回填+40 题翻译),最坏情况 65 分钟
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (Codeforces 反爬需要真实浏览器)
        run: npx playwright install --with-deps chromium

      - name: Install poppler-utils (cf-gyms PDF 题面提字)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch newest + backfill + translate
        env:
          # AI 翻译端点配置在仓库 Secrets（Settings → Secrets and variables → Actions）
          TRANSLATE_BASE_URL: ${{ secrets.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_CONCURRENCY: "4"
          # 比赛日历快照：只在 CI 访问 Clist，线上 API 不再消耗上游配额
          CLIST_API_KEY: ${{ secrets.CLIST_API_KEY }}
          # CI 出口 IP 更容易被 Cloudflare 质询：有头浏览器 + Xvfb 通过率更高
          CF_HEADLESS: "0"
          # cf-gyms 尾阶段的受限 gym 登录兜底（可选 secret，缺失时跳过登录）
          CF_HANDLE: ${{ secrets.CF_HANDLE }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          xvfb-run -a node scripts/fetch.mjs \
            --abc "${{ github.event.inputs.abc_scan || '3' }}" \
            --arc "1" --agc "1" \
            --cf "${{ github.event.inputs.cf_scan || '3' }}" \
            --nc "${{ github.event.inputs.nc_scan || '2' }}" \
            --backfill "${{ github.event.inputs.backfill || '10' }}" \
            --translate-limit "${{ github.event.inputs.translate_limit || '120' }}" \
            --gym-pages "60" --gym-minutes "10" --gym-sweep "0" \
            --gym-translate-limit "${{ github.event.inputs.gym_translate_limit || '40' }}"

      - name: Commit & push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes — skip commit."
          else
            git commit -m "data: fetch & translate $(date -u +%FT%TZ) [skip ci]"
            # push 前先 rebase（审查 管线-3）：工作流 checkout 与 push 之间
            # 长达数十分钟的窗口内任何人工 push 都会让本轮全部抓取/翻译
            # 成果丢失。重试 3 次,每次先 pull --rebase --autostash
            # （范式与 backfill-all.mjs 的 commitPush 一致）。
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                echo "push ok (attempt $i)"
                exit 0
              fi
              echo "push conflict, rebase and retry ($i/3)"
              git fetch origin main
              git pull --rebase --autostash origin main || exit 1
            done
            echo "push failed after 3 attempts"
            exit 1
          fi
