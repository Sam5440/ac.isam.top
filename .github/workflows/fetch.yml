name: Fetch & translate problems

on:
  schedule:
    # 每 6 小时一次（错开整点，规避 GitHub 定时任务高峰丢弃）。
    # 显式写出 4 个触发点（1-23/6 语义同 1/6,但前者在所有 cron 解析器上都
    # 是标准步进写法,不依赖 runner 对 1/6 的兼容）。
    - cron: "23 1-23/6 * * *"
  workflow_dispatch:
    inputs:
      abc_scan:
        description: "扫描最近 N 场 ABC（补新题面）"
        default: "3"
      cf_scan:
        description: "扫描最近 N 场 CF（补新题面）"
        default: "3"
      backfill:
        description: "回填历史未拉取的题面数（从最旧比赛开始）"
        default: "10"
      nc_scan:
        description: "扫描最近 N 场牛客官方赛（补新题面）"
        default: "2"
      translate_limit:
        description: "本次最多翻译题数（0=不限；默认 120 与 npm run fetch:ci 对齐 ——
          不限会让积压期撞 50 分钟 job 上限,已产出的 LLM 费用随 commit 步骤未到达而全部丢失）"
        default: "120"

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (Codeforces 反爬需要真实浏览器)
        run: npx playwright install --with-deps chromium

      - name: Fetch newest + backfill + translate
        env:
          # AI 翻译端点配置在仓库 Secrets（Settings → Secrets and variables → Actions）
          TRANSLATE_BASE_URL: ${{ secrets.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          TRANSLATE_CONCURRENCY: "4"
          # CI 出口 IP 更容易被 Cloudflare 质询：有头浏览器 + Xvfb 通过率更高
          CF_HEADLESS: "0"
        run: |
          xvfb-run -a node scripts/fetch.mjs \
            --abc "${{ github.event.inputs.abc_scan || '3' }}" \
            --arc "1" --agc "1" \
            --cf "${{ github.event.inputs.cf_scan || '3' }}" \
            --nc "${{ github.event.inputs.nc_scan || '2' }}" \
            --backfill "${{ github.event.inputs.backfill || '10' }}" \
            --translate-limit "${{ github.event.inputs.translate_limit || '120' }}"

      - name: Commit & push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes — skip commit."
          else
            git commit -m "data: fetch & translate $(date -u +%FT%TZ) [skip ci]"
            # push 前先 rebase（审查 管线-3）：工作流 checkout 与 push 之间
            # 长达数十分钟的窗口内任何人工 push 都会让本轮全部抓取/翻译
            # 成果丢失。重试 3 次,每次先 pull --rebase --autostash
            # （范式与 backfill-all.mjs 的 commitPush 一致）。
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                echo "push ok (attempt $i)"
                exit 0
              fi
              echo "push conflict, rebase and retry ($i/3)"
              git fetch origin main
              git pull --rebase --autostash origin main || exit 1
            done
            echo "push failed after 3 attempts"
            exit 1
          fi
