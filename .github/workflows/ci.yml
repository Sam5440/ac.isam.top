name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限（审查 管线-11）:构建只需要读代码;fetch.yml 的 contents:write
# 保持在自身文件里
permissions:
  contents: read

# 连续 push 时不并行浪费构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
